name: Generate GitHub Analytics

"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-stats.yml"
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: github-analytics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Normalize GitHub Token
        env:
          RAW_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          token = os.environ["RAW_TOKEN"].strip()
          if not re.fullmatch(r"(?:github_pat_|ghp_)[A-Za-z0-9_]+", token):
              sys.exit("GH_STATS_TOKEN must contain only a valid personal access token; replace the repository secret.")
          print("::add-mask::" + token)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("GH_STATS_TOKEN_CLEAN=" + token + "\n")
          PY

      - name: Validate GitHub Token
        env:
          GH_TOKEN: ${{ env.GH_STATS_TOKEN_CLEAN }}
        run: |
          gh api user --jq '.login'
          gh api rate_limit --jq '.resources.graphql'
          gh api graphql -f query='query { viewer { login repositories(privacy: PRIVATE, ownerAffiliations: OWNER) { totalCount } contributionsCollection { totalCommitContributions restrictedContributionsCount } } }'
          gh api --paginate 'user/repos?affiliation=owner&visibility=all&per_page=100' | jq -s 'add | {public_owned: (map(select(.private == false)) | length), private_owned: (map(select(.private == true)) | length)}' || echo 'REST repository diagnostic unavailable; continuing with GraphQL results.'

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=fmariano44&show_icons=true&theme=tokyonight&include_all_commits=true&count_private=true&hide_border=true"
          path: profile/stats.svg
          token: ${{ env.GH_STATS_TOKEN_CLEAN }}
          fail_on_error: true

      - name: Generate Most Used Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=fmariano44&layout=compact&langs_count=8&card_width=467&theme=tokyonight&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ env.GH_STATS_TOKEN_CLEAN }}
          fail_on_error: true

      - name: Match SVG canvas dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [Path("profile/stats.svg"), Path("profile/top-langs.svg")]
          svgs = [p.read_text() for p in files]
          dims = [tuple(map(int, re.search(r'viewBox="0 0 (\d+) (\d+)"', s).groups())) for s in svgs]
          width = max(w for w,h in dims)
          height = max(h for w,h in dims)
          for p,s,(w,h) in zip(files,svgs,dims):
              s = re.sub(r'(<svg\s+width=")\d+("\s+height=")\d+("\s+viewBox="0 0 )\d+ \d+(")', lambda m: f"{m[1]}{width}{m[2]}{height}{m[3]}{width} {height}{m[4]}", s, count=1)
              # Extend the card background to the common canvas; preserve text scale.
              s = re.sub(r'(<rect\b[^>]*?data-testid="card-bg"[^>]*?>)', lambda m: re.sub(r'height="[^"]+"', f'height="{height-1}"', re.sub(r'width="[^"]+"', f'width="{width-1}"', m[0])), s, count=1)
              p.write_text(s)
          PY

      - name: Commit and Publish Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cards="$(mktemp -d)"
          cp profile/stats.svg profile/top-langs.svg "$cards/"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p profile
            cp "$cards/"*.svg profile/
            git add profile/stats.svg profile/top-langs.svg
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "chore: update GitHub analytics cards"
            export CARDS_COMMIT="$(git rev-parse HEAD)"
            python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text()
          base = "https://raw.githubusercontent.com/fmariano44/fmariano44/"
          for name, alt in [("stats", "GitHub Stats"), ("top-langs", "Most Used Languages")]:
              pattern = r'(\bsrc=")[^"]+(" alt="' + re.escape(alt) + r'")'
              url = base + os.environ["CARDS_COMMIT"] + "/profile/" + name + ".svg"
              text, n = re.subn(pattern, lambda m: m[1] + url + m[2], text)
              if n != 1:
                  raise SystemExit("Expected exactly one README image for " + name)
          path.write_text(text)
          PY
            git add README.md
            if ! git diff --cached --quiet; then
              git commit -m "docs: point analytics images to their immutable revision"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Unable to publish cards after three attempts."
          exit 1
